version: "3.8"

services:
  # PostgreSQL Database for testing
  postgres-test:
    image: postgres:15-alpine
    container_name: horse_racing_postgres_test
    environment:
      POSTGRES_DB: horse_racing_test_db
      POSTGRES_USER: horse_racing_test
      POSTGRES_PASSWORD: test_password_123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - test_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horse_racing_test -d horse_racing_test_db"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Redis for testing
  redis-test:
    image: redis:7-alpine
    container_name: horse_racing_redis_test
    command: redis-server --appendonly yes --requirepass test_redis_123
    volumes:
      - redis_test_data:/data
    ports:
      - "6381:6379"
    networks:
      - test_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # NTFY Server for notification testing
  ntfy-test:
    image: binwiederhier/ntfy:latest
    container_name: horse_racing_ntfy_test
    ports:
      - "8080:80"
    volumes:
      - ntfy_test_data:/var/lib/ntfy
    networks:
      - test_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - NTFY_BASE_URL=http://localhost:8080

  # Test Runner Service
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: horse_racing_test_runner
    environment:
      - TESTING=true
      - DATABASE_URL=postgresql://horse_racing_test:test_password_123@postgres-test:5432/horse_racing_test_db
      - REDIS_URL=redis://:test_redis_123@redis-test:6379/0
      - NTFY_URL=http://ntfy-test:80
      - NTFY_TOPIC=horse-racing-test
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./test-results:/app/test-results
      - ./tests:/app/tests
      - ./src:/app/src
    networks:
      - test_network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      ntfy-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "tests"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        echo '🧪 Waiting for services to be ready...' &&
        sleep 10 &&
        echo '🚀 Running comprehensive test suite...' &&
        pytest tests/ -v 
          --cov=src 
          --cov-report=html:/app/test-results/coverage 
          --cov-report=term-missing
          --html=/app/test-results/report.html 
          --self-contained-html 
          --tb=short 
          --durations=10 &&
        echo '✅ Tests completed successfully!'
      "

  # Web Application for testing
  web-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: horse_racing_web_test
    environment:
      - TESTING=true
      - DATABASE_URL=postgresql://horse_racing_test:test_password_123@postgres-test:5432/horse_racing_test_db
      - REDIS_URL=redis://:test_redis_123@redis-test:6379/0
      - NTFY_URL=http://ntfy-test:80
      - NTFY_TOPIC=horse-racing-test
      - DEBUG=true
      - FLASK_ENV=testing
    ports:
      - "5003:5002"  # Different port for test environment
    volumes:
      - ./src:/app/src
      - ./test-results:/app/test-results
    networks:
      - test_network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      ntfy-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "web"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        echo '🌐 Starting test web application...' &&
        sleep 5 &&
        python main.py
      "

  # Integration Test Service
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: horse_racing_integration_tests
    environment:
      - TESTING=true
      - DATABASE_URL=postgresql://horse_racing_test:test_password_123@postgres-test:5432/horse_racing_test_db
      - REDIS_URL=redis://:test_redis_123@redis-test:6379/0
      - NTFY_URL=http://ntfy-test:80
      - NTFY_TOPIC=horse-racing-test
      - WEB_URL=http://web-test:5002
      - DEBUG=true
    volumes:
      - ./test-results:/app/test-results
      - ./tests:/app/tests
      - ./src:/app/src
    networks:
      - test_network
    depends_on:
      web-test:
        condition: service_healthy
      ntfy-test:
        condition: service_healthy
    profiles:
      - integration
    command: >
      sh -c "
        echo '🔗 Running integration tests...' &&
        sleep 15 &&
        pytest tests/integration/ -v 
          --html=/app/test-results/integration-report.html 
          --self-contained-html &&
        echo '✅ Integration tests completed!'
      "

networks:
  test_network:
    driver: bridge

volumes:
  postgres_test_data:
  redis_test_data:
  ntfy_test_data:
