version: '3.8'

services:
  auto-downloader:
    image: horse-racing-auto-downloader:optimized
    container_name: horserace-auto-downloader
    environment:
      - DOCKER_CONTAINER=true
      - HEADLESS=true
      - PLAYWRIGHT_BROWSERS_PATH=/app/.playwright
      - TZ=Europe/London
      - LOG_LEVEL=INFO
      # WooCommerce credentials (from .env file)
      - HORSERACE_DB_USERNAME=${HORSERACE_DB_USERNAME}
      - HORSERACE_DB_PASSWORD=${HORSERACE_DB_PASSWORD}
      - HORSERACE_DB_RESULTS_URL=${HORSERACE_DB_RESULTS_URL}
      - HORSERACE_DB_CARDS_URL=${HORSERACE_DB_CARDS_URL}
      # Enhanced error handling
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Persistent data storage
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
      # Browser and system optimization
      - /tmp:/tmp
      - /dev/shm:/dev/shm
      # Timezone data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - horse_racing_network
      - traefik
    restart: unless-stopped
    
    # Enhanced startup command with better error handling
    command: ["python", "run_docker_auto_downloader.py", "--mode", "scheduled", "--log-level", "INFO"]
    
    # Improved health check
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m
    
    # Traefik labels for web access
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-dev"
      
      # HTTP Routes for Auto-Downloader Dashboard
      - "traefik.http.routers.auto-downloader-http.rule=Host(`downloader.horse-racing.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.auto-downloader-http.entrypoints=http"
      - "traefik.http.routers.auto-downloader-http.service=auto-downloader"
      
      # HTTPS Routes for Auto-Downloader Dashboard  
      - "traefik.http.routers.auto-downloader.rule=Host(`downloader.horse-racing.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.auto-downloader.entrypoints=websecure"
      - "traefik.http.routers.auto-downloader.tls.certresolver=letsencrypt"
      - "traefik.http.routers.auto-downloader.service=auto-downloader"
      
      # Service configuration (if it exposes a web interface)
      - "traefik.http.services.auto-downloader.loadbalancer.server.port=8080"
      
      # Optional: Add authentication middleware
      # - "traefik.http.routers.auto-downloader.middlewares=auth@file"
    
    # Enhanced startup command with better error handling
    command: ["python", "run_docker_auto_downloader.py", "--mode", "scheduled", "--log-level", "INFO"]
    
    # Improved health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.append('/app'); from src.automation.docker_config import validate_docker_setup; exit(0 if validate_docker_setup() else 1)"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m
    
    # Resource limits optimized for browser operation
    deploy:
      resources:
        limits:
          memory: 3G  # Increased for browser operations
          cpus: '1.5'  # Increased for better performance
        reservations:
          memory: 1G   # Increased base reservation
          cpus: '0.5'

    # Enhanced security and operation
    security_opt:
      - seccomp:unconfined  # Required for Chrome/Chromium in containers
    
    # Browser optimization
    shm_size: 2gb  # Important for browser stability
    
    # Ensure proper shutdown handling
    stop_grace_period: 30s
    stop_signal: SIGTERM

  # Test service for manual runs  
  auto-downloader-test:
    build:
      context: ../..
      dockerfile: Dockerfile.auto-downloader
    container_name: horserace-auto-downloader-test
    environment:
      - DOCKER_CONTAINER=true
      - HEADLESS=true
      - PLAYWRIGHT_BROWSERS_PATH=/app/.playwright
      - TZ=UTC
      - LOG_LEVEL=DEBUG
      - HORSERACE_DB_USERNAME=${HORSERACE_DB_USERNAME}
      - HORSERACE_DB_PASSWORD=${HORSERACE_DB_PASSWORD}
      - HORSERACE_DB_RESULTS_URL=${HORSERACE_DB_RESULTS_URL}
      - HORSERACE_DB_CARDS_URL=${HORSERACE_DB_CARDS_URL}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
      - /tmp:/tmp
      - /dev/shm:/dev/shm
      - /etc/localtime:/etc/localtime:ro
    networks:
      - horserace-network
    # Run once and exit for testing
    command: ["python", "run_docker_auto_downloader.py", "--mode", "once", "--log-level", "DEBUG"]
    profiles:
      - test
    shm_size: 2gb
    security_opt:
      - seccomp:unconfined

networks:
  horserace-network:
    driver: bridge
