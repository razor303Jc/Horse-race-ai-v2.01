# Docker Network Configuration Reference
# =====================================

# Use these connection strings within Docker containers:

# PostgreSQL Database (Internal Docker Network)
DATABASE_URL=postgresql://horse_racing:secure_password_123@postgres:5432/horse_racing_db

# Redis Cache (Internal Docker Network) 
REDIS_URL=redis://:redis_password_123@redis:6379/0

# Notes:
# - 'postgres' and 'redis' are Docker service names defined in docker-compose.yml
# - These hostnames only work within the Docker network
# - External connections should still use localhost with exposed ports (if any)
# - All internal services should use these network names for security

# Service Connections:
# postgres:5432    - PostgreSQL database
# redis:6379       - Redis cache

# Network: horse_racing_network (defined in docker-compose.yml)
