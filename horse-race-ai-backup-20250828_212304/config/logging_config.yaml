version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(module)s - %(funcName)s - %(lineno)d - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  json:
    class: 'pythonjsonlogger.jsonlogger.JsonFormatter'
    format: '%(asctime)s %(name)s %(levelname)s %(module)s %(funcName)s %(lineno)d %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_info:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: /app/logs/application.log
    maxBytes: 10485760  # 10MB
    backupCount: 5

  file_error:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: /app/logs/errors.log
    maxBytes: 10485760  # 10MB
    backupCount: 5

  ml_trainer:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: /app/logs/ml_trainer.log
    maxBytes: 10485760  # 10MB
    backupCount: 3

  database:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: /app/logs/database.log
    maxBytes: 10485760  # 10MB
    backupCount: 3

  pipeline:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: /app/logs/pipeline.log
    maxBytes: 10485760  # 10MB
    backupCount: 3

loggers:
  '':  # root logger
    level: INFO
    handlers: [console, file_info, file_error]
    propagate: false

  ml_trainer:
    level: DEBUG
    handlers: [console, ml_trainer]
    propagate: false
    qualname: ml_trainer

  database:
    level: DEBUG
    handlers: [console, database]
    propagate: false
    qualname: database

  pipeline:
    level: DEBUG
    handlers: [console, pipeline]
    propagate: false
    qualname: pipeline

  sqlalchemy:
    level: WARNING
    handlers: [database]
    propagate: false

  urllib3:
    level: WARNING
    handlers: [file_info]
    propagate: false
