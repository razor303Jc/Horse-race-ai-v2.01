version: '3.8'

services:
  bulk-uploader:
    build:
      context: .
      dockerfile: tools/bulk_uploader/Dockerfile
    container_name: horse_racing_bulk_uploader
    networks:
      - horse_racing_network
    volumes:
      # Mount the data directory to access CSV files
      - ./data:/app/data:ro  # Read-only access to data
      - ./logs:/app/logs     # Write access for logs
      - ./tools/bulk_uploader:/app/bulk_uploader  # Mount bulk uploader code
    environment:
      # Database connection (uses container network)
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=results_horse_racing_db
      - DB_USER=horse_racing
      - DB_PASSWORD=secure_password_123
      
      # Bulk uploader configuration
      - BULK_UPLOAD_MODE=processed_directories
      - BULK_BATCH_SIZE=1000
      - BULK_MAX_WORKERS=4
      - BULK_VALIDATION_LEVEL=strict
      - BULK_CONFLICT_RESOLUTION=ignore
      - PROCESSED_DIR=/app/data/daily_downloads/processed
      - EXCLUDE_DIRS=non_target
      
      # Python environment
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    
    depends_on:
      - postgres
    
    # Override command to run bulk uploader
    command: python /app/bulk_uploader/docker_runner.py
    
    # Restart policy
    restart: "no"  # Manual execution only

networks:
  horse_racing_network:
    external: true

# Note: The postgres service should already be running
# This docker-compose file just adds the bulk uploader service
