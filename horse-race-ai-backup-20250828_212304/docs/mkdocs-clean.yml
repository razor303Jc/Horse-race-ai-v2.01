site_name: Horse Racing AI v2.0 Documentation
site_description: Comprehensive documentation for the Horse Racing AI handicapping system
site_author: Horse Racing AI Team
site_url: https://docs.horse-racing.localhost

# Repository
repo_name: Horse-race-handicaping-ai/Horse-race-ai-v2.0
repo_url: https://github.com/Horse-race-handicaping-ai/Horse-race-ai-v2.0
edit_uri: edit/main/docs/

# Navigation
nav:
  - Home: index.md
  - 🎯 Pipeline Visualization:
    - Pipeline Overview: implementation/pipeline-overview.md
    - Pipeline Expansion Roadmap: implementation/PIPELINE_EXPANSION_ROADMAP.md
    - Live Racing Integration: implementation/LIVE_RACING_INTEGRATION_PLAN.md
    - Visual Charts: implementation/pipeline-charts.md
  - 📊 Reports & Analytics:
    - Data Volume Analysis: reports/data-analysis.md
    - ML Model Performance: reports/ml-performance.md
    - Monte Carlo Results: reports/monte-carlo.md
    - Daily Reports: reports/daily-reports.md
    - System Health: reports/system-health.md
    - Analytics Dashboard: reports/analytics-dashboard.md
  - 🧠 Advanced Analytics:
    - Form Scoring System: analytics/form-scoring.md
    - Power Ratings: analytics/power-ratings.md
    - Speed Analysis: analytics/speed-analysis.md
    - Pace Analysis: analytics/pace-analysis.md
  - 📋 Live Monitoring:
    - System Dashboard: monitoring/system-dashboard.md
  - 📚 Documentation:
    - Complete Implementation: documentation/IMPLEMENTATION_COMPLETE.md
    - Development Journey: documentation/COMPLETE_DEVELOPMENT_JOURNEY.md
    - ML Implementation: documentation/ML_IMPLEMENTATION_COMPLETE.md
    - Monte Carlo Implementation: documentation/MONTE_CARLO_IMPLEMENTATION_COMPLETE.md
    - Next Phase Roadmap: documentation/NEXT_PHASE_ROADMAP.md
    - Docker Reference: documentation/DOCKER_QUICK_REFERENCE.md
    - Auto Downloader Guide: documentation/ENHANCED_AUTO_DOWNLOAD_COMPLETE.md
  - ⚙️ Configuration:
    - Requirements: requirements.txt
    - Project Config: pyproject.toml

# Theme
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

# Plugins
plugins:
  - search
  - macros

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

# Additional configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Horse-race-handicaping-ai/Horse-race-ai-v2.0
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  version:
    provider: mike

# Custom CSS
extra_css:
  - stylesheets/extra.css

# Custom JavaScript
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
