global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Horse Racing Web Application
  - job_name: 'horse-racing-web-app'
    static_configs:
      - targets: ['web-app:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Horse Racing API
  - job_name: 'horse-racing-api'
    static_configs:
      - targets: ['web-app:8000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # PostgreSQL Database (if postgres_exporter is added)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis Cache (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Docker containers metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  # Node metrics (system level)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
