# Unified ML Training Configuration
# Configuration file for the UnifiedMLTrainer system

# Production mode - fast, reliable training for daily operations
production:
  mode: "production"
  feature_set: "standard"
  models:
    - "RandomForest"
    - "GradientBoosting" 
    - "Logistic"
  hyperparameter_tuning: false
  class_balancing: null
  ensemble_method: null
  parallel_training: false
  cross_validation_folds: 5
  test_size: 0.2
  random_state: 42
  performance_tracking: true

# Enhanced mode - better performance with moderate training time
enhanced:
  mode: "enhanced"
  feature_set: "advanced"
  models:
    - "RandomForest"
    - "GradientBoosting"
    - "MLP"
    - "ExtraTrees"
  hyperparameter_tuning: true
  class_balancing: "smote"
  ensemble_method: "voting"
  parallel_training: true
  cross_validation_folds: 5
  test_size: 0.2
  random_state: 42
  performance_tracking: true

# Experimental mode - cutting-edge techniques for research
experimental:
  mode: "experimental"
  feature_set: "experimental"
  models:
    - "RandomForest"
    - "GradientBoosting"
    - "ExtraTrees"
    - "MLP"
    - "Logistic"
  hyperparameter_tuning: true
  class_balancing: "adasyn"
  ensemble_method: "stacking"
  parallel_training: true
  cross_validation_folds: 10
  test_size: 0.15
  random_state: 42
  performance_tracking: true

# Fast mode - minimal training time for quick iterations
fast:
  mode: "fast"
  feature_set: "basic"
  models:
    - "RandomForest"
    - "Logistic"
  hyperparameter_tuning: false
  class_balancing: null
  ensemble_method: null
  parallel_training: false
  cross_validation_folds: 3
  test_size: 0.3
  random_state: 42
  performance_tracking: false

# Hyperparameter grids for tuning
hyperparameter_grids:
  RandomForest:
    n_estimators: [100, 200, 300]
    max_depth: [10, 15, 20, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
    max_features: ["sqrt", "log2"]
  
  GradientBoosting:
    n_estimators: [100, 200, 300]
    learning_rate: [0.05, 0.1, 0.15]
    max_depth: [3, 5, 7]
    subsample: [0.8, 0.9, 1.0]
  
  MLP:
    hidden_layer_sizes: [[50], [100], [100, 50], [200, 100]]
    alpha: [0.0001, 0.001, 0.01]
    learning_rate: ["constant", "adaptive"]

# Database configuration
database:
  host: "localhost"
  port: 5433
  database: "horse_racing_db"
  user: "horse_racing"
  password: "secure_password_123"

# Performance targets and monitoring
performance_targets:
  training_time_minutes:
    fast: 5
    production: 15
    enhanced: 30
    experimental: 60
  
  minimum_roc_auc:
    fast: 0.65
    production: 0.75
    enhanced: 0.80
    experimental: 0.85
  
  minimum_accuracy:
    fast: 0.70
    production: 0.80
    enhanced: 0.85
    experimental: 0.88

# Feature engineering configuration
feature_engineering:
  basic_features:
    - "log_odds"
    - "implied_probability" 
    - "is_favorite"
    - "combined_performance"
    - "horse_age"
    - "horse_weight_kg"
    - "draw"
  
  standard_features:
    - "log_odds"
    - "implied_probability"
    - "odds_rank"
    - "is_favorite"
    - "combined_performance"
    - "field_size"
    - "min_odds"
    - "max_odds"
    - "avg_odds"
    - "draw_percentile"
    - "weight_percentile"
    - "age_category"
    - "horse_age"
    - "horse_weight_kg"
    - "draw"
    - "jockey_win_pct"
    - "trainer_win_pct"
  
  advanced_features:
    # Includes all standard features plus:
    - "is_outsider"
    - "market_strength"
    - "market_share"
    - "competitive_density"
    - "odds_weight_interaction"
    - "age_draw_interaction"
  
  experimental_features:
    # Includes all advanced features plus:
    - "price_movement"
    - "form_rating"
    - "triple_interaction"

# Model persistence settings
model_persistence:
  save_models: true
  save_scaler: true
  save_feature_engineer: true
  save_results: true
  model_format: "joblib"
  compression_level: 3

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "unified_ml_training.log"
