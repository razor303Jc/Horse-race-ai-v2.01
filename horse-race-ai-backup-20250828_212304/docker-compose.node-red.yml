version: '3.8'

services:
  # Node-RED Automation Service
  node-red:
    build:
      context: ./docker/node-red
      dockerfile: Dockerfile
    container_name: horse_racing_node_red
    restart: unless-stopped
    environment:
      - TZ=UTC
      - NODE_RED_LOG_LEVEL=info
      - NODE_RED_CREDENTIAL_SECRET=horse_racing_ai_secret_key_2024
      - DATABASE_URL=postgresql://horse_racing:secure_password_123@host.docker.internal:5432/postgres
      - CARDS_DATABASE_URL=postgresql://horse_racing:secure_password_123@host.docker.internal:5432/cards_horse_racing_db
      - RESULTS_DATABASE_URL=postgresql://horse_racing:secure_password_123@host.docker.internal:5432/results_horse_racing_db
      - ADVANCED_DATABASE_URL=postgresql://horse_racing:secure_password_123@host.docker.internal:5432/advanced_racing_metrics_db
      - SMTP_USER=${SMTP_USER:-your-email@gmail.com}
      - APP_PASSWORD=${APP_PASSWORD:-awmf ulio rtjv qybx}
    ports:
      - "1881:1880"  # Using port 1881 to avoid conflict with existing Node-RED
    volumes:
      # Node-RED data persistence
      - node_red_data:/data
      # Access to project files for automation
      - ./:/workspace:ro
      # Access to data directories
      - ./data:/workspace/data
      - ./logs:/workspace/logs
      - ./temp_extract:/workspace/temp_extract
      - ./temp_card_processing:/workspace/temp_card_processing
      # Access to tools and scripts
      - ./tools:/workspace/tools:ro
      - ./scripts:/workspace/scripts:ro
    networks:
      - horse_racing_network
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=horse_racing_network"
      - "traefik.http.routers.node-red.rule=Host(`nodered.horse-racing.local`)"
      - "traefik.http.routers.node-red.entrypoints=websecure"
      - "traefik.http.routers.node-red.tls.certresolver=letsencrypt"
      - "traefik.http.services.node-red.loadbalancer.server.port=1880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Existing services (keeping your current setup)
  postgres:
    image: postgres:15
    container_name: horse_racing_postgres_clean
    restart: unless-stopped
    environment:
      POSTGRES_DB: horse_racing
      POSTGRES_USER: horse_racing
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - horse_racing_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horse_racing"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: horse_racing_redis_clean
    restart: unless-stopped
    ports:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - horse_racing_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ML Training Service
  ml-trainer:
    build:
      context: .
      dockerfile: docker/ml-trainer/Dockerfile
    container_name: horse_racing_ml_trainer_clean
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=horse_racing
      - POSTGRES_USER=horse_racing
      - POSTGRES_PASSWORD=secure_password_123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./:/app
      - ml_models:/app/models
      - ./logs:/app/logs
    networks:
      - horse_racing_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg2; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Pipeline Service
  data-pipeline:
    build:
      context: .
      dockerfile: docker/data-pipeline/Dockerfile
    container_name: horse_racing_data_pipeline_clean
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=horse_racing
      - POSTGRES_USER=horse_racing
      - POSTGRES_PASSWORD=secure_password_123
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - horse_racing_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "print('Pipeline OK')"]
      interval: 60s
      timeout: 15s
      retries: 3

  # Web Application
  web-app:
    build:
      context: .
      dockerfile: docker/web-app/Dockerfile
    container_name: horse_racing_web_app_clean
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=horse_racing
      - POSTGRES_USER=horse_racing
      - POSTGRES_PASSWORD=secure_password_123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:8000"
    volumes:
      - ./:/app
      - ./static:/app/static
    networks:
      - horse_racing_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=horse_racing_network"
      - "traefik.http.routers.web-app.rule=Host(`app.horse-racing.local`)"
      - "traefik.http.routers.web-app.entrypoints=websecure"
      - "traefik.http.routers.web-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-app.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: horse_racing_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@horse-racing.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8083:80"
    networks:
      - horse_racing_network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ml_models:
    driver: local
  node_red_data:
    driver: local

networks:
  horse_racing_network:
    driver: bridge
    external: false
