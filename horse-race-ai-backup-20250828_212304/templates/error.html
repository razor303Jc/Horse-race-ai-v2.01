<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horse Racing AI v2.0 - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .error-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 3rem;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="mb-4">
            <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
        </div>
        
        <h1 class="display-4 text-danger mb-3">
            {% if error_code %}{{ error_code }}{% else %}Error{% endif %}
        </h1>
        
        <p class="lead text-muted mb-4">{{ error }}</p>
        
        <div class="alert alert-info">
            <strong>🤖 Horse Racing AI v2.0</strong><br>
            The system is still operational. This is an isolated issue.
        </div>
        
        <div class="mt-4">
            <a href="/" class="btn btn-primary btn-lg me-3">
                <i class="fas fa-home"></i> Return to Dashboard
            </a>
            <a href="/api/system_status" class="btn btn-outline-info">
                <i class="fas fa-info-circle"></i> System Status
            </a>
        </div>
        
        <div class="mt-4 text-muted">
            <small>
                <i class="fas fa-clock"></i> 
                {{ current_time }}
            </small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
