<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐦 Racing Media Analyzer - Horse Racing AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .header .subtitle {
            color: #7f8c8d;
            font-size: 1.2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .card h2 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }
        
        .analyzer-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .control-group label {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .control-group select,
        .control-group input {
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-display {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            font-weight: 500;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .report-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1.5rem;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }
        
        .report-card:hover {
            transform: translateY(-5px);
        }
        
        .report-date {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        
        .report-time {
            color: #6c757d;
            margin-bottom: 1rem;
        }
        
        .report-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-small:hover {
            background: #5a6268;
        }
        
        .nav-back {
            margin-bottom: 1rem;
        }
        
        .nav-back a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .nav-back a:hover {
            background: rgba(255,255,255,0.3);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }
            
            .analyzer-controls {
                grid-template-columns: 1fr;
            }
            
            .reports-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐦 Racing Media Analyzer</h1>
        <p class="subtitle">AI-Powered Social Media & News Analysis for Horse Racing</p>
    </div>
    
    <div class="container">
        <div class="nav-back">
            <a href="/">← Back to Dashboard</a>
        </div>
        
        <div class="card">
            <h2>📊 Start New Analysis</h2>
            <div class="analyzer-controls">
                <div class="control-group">
                    <label for="dateSelect">Select Date:</label>
                    <select id="dateSelect">
                        <option value="today">Today</option>
                        <option value="tomorrow">Tomorrow</option>
                        <option value="yesterday">Yesterday</option>
                        <option value="custom">Custom Date</option>
                    </select>
                </div>
                
                <div class="control-group" id="customDateGroup" style="display: none;">
                    <label for="customDate">Custom Date:</label>
                    <input type="date" id="customDate" />
                </div>
            </div>
            
            <button id="startAnalysisBtn" class="btn">🚀 Start Racing Analysis</button>
            
            <div id="analysisStatus"></div>
        </div>
        
        <div class="card">
            <h2>📁 Available Reports</h2>
            <div id="reportsContainer">
                <div class="status-info">
                    🔄 Loading available reports...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Handle date selection
        document.getElementById('dateSelect').addEventListener('change', function() {
            const customGroup = document.getElementById('customDateGroup');
            if (this.value === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        });
        
        // Start analysis
        document.getElementById('startAnalysisBtn').addEventListener('click', function() {
            const dateSelect = document.getElementById('dateSelect');
            const customDate = document.getElementById('customDate');
            const statusDiv = document.getElementById('analysisStatus');
            const btn = this;
            
            let targetDate = dateSelect.value;
            if (targetDate === 'custom' && customDate.value) {
                targetDate = customDate.value;
            }
            
            btn.disabled = true;
            btn.textContent = '🔄 Starting Analysis...';
            
            statusDiv.innerHTML = '<div class="status-info">🤖 Starting WhiteRabbit Neo analysis...</div>';
            
            fetch('/api/racing_analyzer/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date: targetDate })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.innerHTML = '<div class="status-success">✅ Analysis completed successfully!</div>';
                    loadReports(); // Reload reports
                } else {
                    statusDiv.innerHTML = `<div class="status-error">❌ Error: ${data.error}</div>`;
                }
            })
            .catch(error => {
                statusDiv.innerHTML = `<div class="status-error">❌ Network Error: ${error.message}</div>`;
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = '🚀 Start Racing Analysis';
            });
        });
        
        // Load available reports
        function loadReports() {
            const container = document.getElementById('reportsContainer');
            
            fetch('/api/racing_analyzer/reports')
                .then(response => response.json())
                .then(data => {
                    if (data.reports && data.reports.length > 0) {
                        container.innerHTML = `
                            <div class="reports-grid">
                                ${data.reports.map(report => `
                                    <div class="report-card">
                                        <div class="report-date">${formatDate(report.date)}</div>
                                        <div class="report-time">Generated at ${report.time}</div>
                                        <div class="report-actions">
                                            <a href="/reports/${report.html_file}" target="_blank" class="btn-small">📄 View Report</a>
                                            <button onclick="downloadReport('${report.json_file}')" class="btn-small">💾 Download JSON</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    } else {
                        container.innerHTML = '<div class="status-info">📭 No reports available yet. Start an analysis to generate reports.</div>';
                    }
                })
                .catch(error => {
                    container.innerHTML = '<div class="status-error">❌ Failed to load reports</div>';
                });
        }
        
        // Format date for display
        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }
        
        // Download report function
        function downloadReport(filename) {
            window.open(`/reports/${filename}`, '_blank');
        }
        
        // Load reports on page load
        loadReports();
        
        // Auto-refresh reports every 30 seconds
        setInterval(loadReports, 30000);
    </script>
</body>
</html>
