<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏇 Race Cards - Horse Racing AI v2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .race-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .race-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        
        .course-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
        }
        
        .race-item {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .race-item:hover {
            background: #e3f2fd;
            border-color: #2196f3;
            transform: translateX(5px);
        }
        
        .race-time {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .race-class {
            background: #17a2b8;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .prize-money {
            color: #28a745;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .going-badge {
            background: #6f42c1;
            color: white;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        .field-size {
            background: #fd7e14;
            color: white;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        .header-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="header-container">
            <h1 class="display-4 mb-3">🏇 Today's Race Cards</h1>
            <p class="lead text-muted mb-4">Live Race Data</p>
            <div class="text-center mb-3">
                <a href="/" class="btn btn-outline-primary me-2">← Dashboard</a>
                <a href="/live_analytics" class="btn btn-outline-success me-2">Live Analytics</a>
                <a href="/betting_strategies" class="btn btn-outline-warning">Betting Strategies</a>
            </div>
            
            <!-- Stats Row -->
            <div class="row mt-4">
                <div class="col-md-4">
                    <div class="text-center p-3 bg-light rounded">
                        <i class="fas fa-flag-checkered fa-2x text-primary mb-2"></i>
                        <h6>Total Races</h6>
                        <p class="h4 text-primary" id="total-races">Loading...</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="text-center p-3 bg-light rounded">
                        <i class="fas fa-horse fa-2x text-success mb-2"></i>
                        <h6>Total Runners</h6>
                        <p class="h4 text-success" id="total-horses">Loading...</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="text-center p-3 bg-light rounded">
                        <i class="fas fa-clock fa-2x text-warning mb-2"></i>
                        <h6>Last Updated</h6>
                        <p class="h6 text-muted" id="last-updated">Loading...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Race Cards Container -->
        <div id="race-cards-container">
            <div class="race-card text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Loading race cards...</p>
            </div>
        </div>
    </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display real race data
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Loading real race cards...');
            loadRealRaceCards();
            
            // Auto-refresh every 5 minutes
            setInterval(function() {
                loadRealRaceCards();
            }, 300000);
        });

        async function loadRealRaceCards() {
            try {
                const response = await fetch('/api/real_race_cards');
                const data = await response.json();
                
                if (response.ok) {
                    displayRaceCards(data);
                    updateStats(data);
                } else {
                    console.error('Failed to load race cards:', data.detail);
                    showError(data.detail || 'Failed to load race cards');
                }
            } catch (error) {
                console.error('Error loading race cards:', error);
                showError('Network error loading race cards');
            }
        }

        function displayRaceCards(data) {
            const container = document.getElementById('race-cards-container');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (data.races && data.races.length > 0) {
                // Group races by course
                const racesByCourse = {};
                data.races.forEach(race => {
                    if (!racesByCourse[race.course]) {
                        racesByCourse[race.course] = [];
                    }
                    racesByCourse[race.course].push(race);
                });

                // Display races by course
                Object.keys(racesByCourse).forEach(course => {
                    const courseDiv = document.createElement('div');
                    courseDiv.innerHTML = `
                        <div class="course-header">
                            <h2><i class="fas fa-map-marker-alt"></i> ${course}</h2>
                            <p class="mb-0">${racesByCourse[course].length} races today</p>
                        </div>
                    `;
                    container.appendChild(courseDiv);

                    racesByCourse[course].forEach(race => {
                        const raceDiv = document.createElement('div');
                        raceDiv.className = 'race-card';
                        raceDiv.innerHTML = createRaceCardHTML(race);
                        container.appendChild(raceDiv);
                    });
                });
            } else {
                container.innerHTML = `
                    <div class="race-card text-center">
                        <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                        <h4>No race cards available</h4>
                        <p class="text-muted">Please check back later or contact support if this persists.</p>
                    </div>
                `;
            }
        }

        function createRaceCardHTML(race) {
            const topHorses = race.horses.slice(0, 5); // Show top 5 horses
            
            return `
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <h4><i class="fas fa-flag-checkered"></i> Race ${race.race_number}</h4>
                        <h5 class="text-primary">${race.race_name}</h5>
                        <p class="text-muted mb-2">
                            <i class="fas fa-clock"></i> ${race.race_time} | 
                            <i class="fas fa-ruler"></i> ${race.distance} | 
                            <i class="fas fa-layer-group"></i> ${race.class}
                        </p>
                    </div>
                    <div class="text-end">
                        <span class="badge bg-success fs-6">${race.runners} runners</span>
                        <p class="text-muted small mt-1">${race.prize}</p>
                    </div>
                </div>
                
                <div class="horses-list">
                    <h6><i class="fas fa-horse"></i> Top Contenders</h6>
                    ${topHorses.map((horse, index) => `
                        <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                            <div class="d-flex align-items-center">
                                <span class="badge bg-secondary me-2">${index + 1}</span>
                                <div>
                                    <strong>${horse.horse_name}</strong>
                                    <br>
                                    <small class="text-muted">
                                        J: ${horse.jockey} | T: ${horse.trainer} | Age: ${horse.age}
                                    </small>
                                </div>
                            </div>
                            <div class="text-end">
                                <span class="fw-bold text-primary">${horse.odds}</span>
                                <br>
                                <small class="text-success">${horse.win_probability}%</small>
                            </div>
                        </div>
                    `).join('')}
                    
                    ${race.horses.length > 5 ? `
                        <div class="text-center mt-2">
                            <button class="btn btn-outline-primary btn-sm" onclick="showFullRace('${race.race_id}')">
                                <i class="fas fa-eye"></i> View All ${race.runners} Runners
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function updateStats(data) {
            document.getElementById('total-races').textContent = data.total_races || 0;
            document.getElementById('total-horses').textContent = data.total_horses || 0;
            document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
        }

        function showError(message) {
            const container = document.getElementById('race-cards-container');
            if (container) {
                container.innerHTML = `
                    <div class="race-card text-center">
                        <i class="fas fa-exclamation-circle fa-3x text-danger mb-3"></i>
                        <h4>Error Loading Race Cards</h4>
                        <p class="text-muted">${message}</p>
                        <button class="btn btn-primary" onclick="loadRealRaceCards()">
                            <i class="fas fa-refresh"></i> Retry
                        </button>
                    </div>
                `;
            }
        }

        function showFullRace(raceId) {
            window.open(`/api/race_details/${raceId}`, '_blank');
        }
    </script>
</body>
</html>
