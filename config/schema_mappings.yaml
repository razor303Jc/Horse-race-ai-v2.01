# Schema Mappings Configuration
# Single source of truth for CSV-to-Database column mappings

tables:
  horses:
    csv_mappings:
      id: horse_id
      name: horse_name
      UptoDate: uptodate
      uptodate: uptodate
    required_fields:
      - horse_id
      - horse_name
    type_conversions:
      "-": null
      "": null

  jockeys_stats:
    csv_mappings:
      UptoDate: uptodate
      Jockey_ID: jockey_id
      Name: jockey_name
    required_fields:
      - jockey_id
      - jockey_name
    type_conversions:
      "-": null
      "": null

  trainers_stats:
    csv_mappings:
      UptoDate: uptodate
      Trainer_ID: trainer_id
      Name: trainer_name
    required_fields:
      - trainer_id
      - trainer_name
    type_conversions:
      "-": null
      "": null

  records:
    csv_mappings:
      id: record_id
      Race_ID: race_id
    required_fields:
      - race_id
    type_conversions:
      "-": null
      "": null

  races:
    csv_mappings:
      Race_ID: race_id
    required_fields:
      - race_id
    type_conversions:
      "-": null
      "": null

# Global type conversion rules
global_conversions:
  null_values: ["-", "", "None", "NULL", "null"]
  integer_fields: ["id", "race_id", "horse_id", "jockey_id", "trainer_id"]
  string_cleaning:
    trim_whitespace: true
    normalize_case: false
