database:
  auto_backup: true
  database: horse_racing_db
  host: localhost
  password: secure_password_123
  port: 5433
  retention_days: 30
  update_sources:
  - racing_data_api
  - form_updates
  - track_conditions
  - jockey_trainer_stats
