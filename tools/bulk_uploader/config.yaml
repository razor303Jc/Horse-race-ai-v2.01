# Bulk Uploader Configuration
# YAML configuration file for the bulk uploader system

# Processing configuration
processing:
  batch_size: 1000                    # Records per batch for bulk insert
  max_workers: 4                      # Maximum parallel workers
  validation_level: "strict"          # strict, moderate, lenient
  conflict_resolution: "ignore"       # ignore, update, error
  foreign_key_handling: "ordered"     # ordered, disabled
  max_memory_usage: "1GB"            # Memory limit for processing
  retry_attempts: 3                   # Number of retry attempts
  retry_delay: 1.0                    # Delay between retries (seconds)
  connection_pool_size: 10            # Database connection pool size

# Database configuration (environment-specific)
database:
  # Development (local)
  development:
    host: "localhost"
    port: 5432
    database: "results_horse_racing_db"
    user: "horse_racing"
    password: "secure_password_123"
  
  # Container (Docker)
  container:
    host: "postgres"
    port: 5432
    database: "results_horse_racing_db"
    user: "horse_racing"
    password: "secure_password_123"
  
  # Production (environment variables)
  production:
    host: "${DB_HOST}"
    port: "${DB_PORT}"
    database: "${DB_NAME}"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"

# File processing rules
file_processing:
  # Supported file formats
  supported_formats:
    - ".csv"
    - ".json"
    - ".xlsx"
    - ".xls"
  
  # File classification rules
  classification_rules:
    horses:
      - "horse"
      - "mapped_horses"
      - "horse_data"
    jockeys_stats:
      - "jockey"
      - "mapped_jockeys_stats"
      - "jockey_data"
    trainers_stats:
      - "trainer"
      - "mapped_trainers_stats"
      - "trainer_data"
    races:
      - "race"
      - "mapped_races"
      - "race_data"
    records:
      - "record"
      - "result"
      - "mapped_records"
      - "results_data"

# Column mappings for data transformation
column_mappings:
  horses:
    id: "horse_id"
    name: "horse_name"
    UptoDate: "uptodate"
    uptodate: "uptodate"
  
  jockeys_stats:
    UptoDate: "uptodate"
    Jockey_ID: "jockey_id"
    Name: "jockey_name"
  
  trainers_stats:
    UptoDate: "uptodate"
    Trainer_ID: "trainer_id"
    Name: "trainer_name"
  
  records:
    id: "record_id"
    Race_ID: "race_id"
  
  races:
    Race_ID: "race_id"

# Upload order for foreign key constraints
upload_order:
  races: 1          # Parent table - must be uploaded first
  horses: 2         # Independent table
  jockeys_stats: 2  # Independent table
  trainers_stats: 2 # Independent table
  records: 3        # Child table - depends on races

# Logging configuration
logging:
  level: "INFO"     # DEBUG, INFO, WARNING, ERROR
  file: "/tmp/bulk_uploader.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
# Validation rules
validation:
  # Data integrity checks
  check_duplicates: true
  check_empty_rows: true
  check_date_formats: true
  check_negative_values: true
  
  # Schema validation
  require_column_mapping: true
  check_required_columns: true
  validate_data_types: true
  
  # Performance thresholds
  max_file_size: "500MB"
  max_rows_per_file: 1000000
  memory_usage_threshold: 0.8  # 80% of max_memory_usage

# Error handling
error_handling:
  continue_on_validation_error: false
  continue_on_upload_error: true
  create_error_reports: true
  error_report_path: "/tmp/bulk_upload_errors.json"

# Performance optimization
performance:
  use_bulk_insert: true
  optimize_batch_size: true
  parallel_validation: true
  memory_efficient_processing: true
  
# Monitoring and reporting
monitoring:
  progress_reporting: true
  performance_metrics: true
  detailed_logging: true
  status_file: "/tmp/bulk_upload_status.json"
