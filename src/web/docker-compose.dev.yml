version: "3.8"

# Development Docker Compose with hot reloading and volume mounting
services:
  # Development React + FastAPI with live reload
  horse-racing-ai-dev:
    build:
      context: ../..
      dockerfile: configs/docker/Dockerfile.react.dev
    container_name: horse_racing_dev_app
    environment:
      # Database configuration
      DATABASE_URL: postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0

      # Development settings
      NODE_ENV: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      PYTHONPATH: /app
      REACT_APP_API_URL: http://localhost:8001

      # Hot reload settings
      CHOKIDAR_USEPOLLING: "true"
      FAST_REFRESH: "true"
      WDS_SOCKET_HOST: localhost
      WDS_SOCKET_PORT: 5003

      # API settings
      API_HOST: 0.0.0.0
      API_PORT: 8001

      # Scraping configuration
      SCRAPER_HEADLESS: "false"
      SCRAPER_TIMEOUT: 30000

      # Notification settings
      NTFY_TOPIC: ${NTFY_TOPIC:-horse-racing-dev}
      NTFY_URL: http://ntfy:8081

      # ML Model settings
      MODEL_PATH: /app/models
      FEATURE_CACHE_PATH: /app/cache/features
    volumes:
      # Mount source code for live reloading
      - ../../src:/app/src:cached
      - ../../src/web:/app/frontend:cached
      
      # Mount build outputs (for faster rebuilds)
      - ../../src/web/node_modules:/app/frontend/node_modules:cached
      - ../../src/web/dist:/app/frontend/dist:cached
      
      # Mount data directories
      - ../../data:/app/data:cached
      - ../../models:/app/models:cached
      - ../../cache:/app/cache:cached
      - ../../logs:/app/logs:cached
      - ../../trained_models:/app/trained_models:cached
      - ../../reports:/app/reports:cached
      
      # Configuration files
      - ../../config:/app/config:cached
      - ../../pyproject.toml:/app/pyproject.toml:cached
      - ../../requirements.txt:/app/requirements.txt:cached
      
      # For live reload to work properly
      - /app/frontend/node_modules
    ports:
      - "5003:5003"  # React dev server (Vite)
      - "8001:8001"  # FastAPI server
      - "24678:24678"  # Vite HMR port
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - horse_racing_network
    restart: unless-stopped
    command: >
      sh -c "
        echo '🚀 Starting development environment...' &&
        cd /app/frontend &&
        npm install &&
        echo '📦 Dependencies installed' &&
        npm run dev -- --host 0.0.0.0 --port 5003 &
        echo '⚛️ React dev server started' &&
        cd /app &&
        python src/web/api_server_enhanced.py --host 0.0.0.0 --port 8001 &
        echo '🔧 API server started' &&
        wait
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003", "&&", "curl", "-f", "http://localhost:8001/api/system_status"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=horse_racing_network"
      
      # React development server
      - "traefik.http.routers.horse-racing-dev-react.rule=Host(`dev.horse-racing.localhost`)"
      - "traefik.http.routers.horse-racing-dev-react.entrypoints=http"
      - "traefik.http.routers.horse-racing-dev-react.service=horse-racing-dev-react"
      - "traefik.http.services.horse-racing-dev-react.loadbalancer.server.port=5003"
      
      # API development server
      - "traefik.http.routers.horse-racing-dev-api.rule=Host(`api.dev.horse-racing.localhost`)"
      - "traefik.http.routers.horse-racing-dev-api.entrypoints=http"
      - "traefik.http.routers.horse-racing-dev-api.service=horse-racing-dev-api"
      - "traefik.http.services.horse-racing-dev-api.loadbalancer.server.port=8001"

  # Use existing services from main docker-compose
  postgres:
    extends:
      file: ../../docker-compose.yml
      service: postgres

  redis:
    extends:
      file: ../../docker-compose.yml
      service: redis

  ntfy:
    extends:
      file: ../../docker-compose.yml
      service: ntfy

volumes:
  postgres_data:
    external: true
  redis_data:
    external: true
  ntfy_cache:
    external: true

networks:
  horse_racing_network:
    external: true
    name: horse_racing_network
  traefik:
    external: true
    name: traefik-dev
