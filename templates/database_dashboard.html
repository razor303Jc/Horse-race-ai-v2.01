<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horse Racing Database Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .nav-tabs {
            display: flex;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 30px;
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-tab:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .nav-tab.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .data-table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .table-header {
            background: #667eea;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: between;
            align-items: center;
        }

        .table-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .search-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            placeholder-color: rgba(255, 255, 255, 0.7);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .data-table tr:hover {
            background: #f8f9fa;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .page-btn:hover {
            background: #f0f0f0;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐴 Horse Racing Database Dashboard</h1>
            <p>Comprehensive racing data analysis and insights</p>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active" data-tab="overview">Overview</div>
            <div class="nav-tab" data-tab="races">Races</div>
            <div class="nav-tab" data-tab="horses">Horses</div>
            <div class="nav-tab" data-tab="jockeys">Jockeys</div>
            <div class="nav-tab" data-tab="trainers">Trainers</div>
            <div class="nav-tab" data-tab="analytics">Analytics</div>
        </div>

        <!-- Overview Tab -->
        <div id="overview" class="tab-content active">
            <div class="stats-grid" id="overview-stats">
                <!-- Stats will be loaded here -->
            </div>
            
            <div class="chart-container">
                <div class="chart-title">Recent Race Activity</div>
                <canvas id="raceActivityChart" width="400" height="200"></canvas>
            </div>
        </div>

        <!-- Races Tab -->
        <div id="races" class="tab-content">
            <div class="data-table-container">
                <div class="table-header">
                    <div class="table-title">Recent Races</div>
                    <div class="search-container">
                        <input type="text" id="race-search" class="search-input" placeholder="Search by course...">
                        <input type="date" id="race-date-from" class="search-input">
                        <input type="date" id="race-date-to" class="search-input">
                        <button class="btn btn-secondary" onclick="searchRaces()">Search</button>
                    </div>
                </div>
                <div id="races-table-container">
                    <!-- Races table will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Horses Tab -->
        <div id="horses" class="tab-content">
            <div class="data-table-container">
                <div class="table-header">
                    <div class="table-title">Horse Database</div>
                    <div class="search-container">
                        <input type="text" id="horse-search" class="search-input" placeholder="Search horses...">
                        <button class="btn btn-secondary" onclick="searchHorses()">Search</button>
                    </div>
                </div>
                <div id="horses-table-container">
                    <!-- Horses table will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Jockeys Tab -->
        <div id="jockeys" class="tab-content">
            <div class="data-table-container">
                <div class="table-header">
                    <div class="table-title">Jockey Statistics</div>
                </div>
                <div id="jockeys-table-container">
                    <!-- Jockeys table will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Trainers Tab -->
        <div id="trainers" class="tab-content">
            <div class="data-table-container">
                <div class="table-header">
                    <div class="table-title">Trainer Statistics</div>
                </div>
                <div id="trainers-table-container">
                    <!-- Trainers table will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Analytics Tab -->
        <div id="analytics" class="tab-content">
            <div class="chart-container">
                <div class="chart-title">Race Statistics by Course</div>
                <canvas id="courseChart" width="400" height="200"></canvas>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">Race Type Distribution</div>
                <canvas id="raceTypeChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentPage = { races: 0, horses: 0, jockeys: 0, trainers: 0 };
        const pageSize = 20;

        // Initialize dashboard
        $(document).ready(function() {
            loadOverviewStats();
            loadRaces();
            setupTabNavigation();
        });

        // Tab navigation
        function setupTabNavigation() {
            $('.nav-tab').click(function() {
                const tabName = $(this).data('tab');
                
                // Update active tab
                $('.nav-tab').removeClass('active');
                $(this).addClass('active');
                
                // Show corresponding content
                $('.tab-content').removeClass('active');
                $(`#${tabName}`).addClass('active');
                
                // Load tab-specific data
                loadTabData(tabName);
            });
        }

        function loadTabData(tabName) {
            switch(tabName) {
                case 'overview':
                    loadOverviewStats();
                    break;
                case 'races':
                    loadRaces();
                    break;
                case 'horses':
                    loadHorses();
                    break;
                case 'jockeys':
                    loadJockeys();
                    break;
                case 'trainers':
                    loadTrainers();
                    break;
                case 'analytics':
                    loadAnalytics();
                    break;
            }
        }

        // Load overview statistics
        function loadOverviewStats() {
            $('#overview-stats').html('<div class="loading">Loading statistics...</div>');
            
            $.get('/api/database/summary')
                .done(function(data) {
                    displayOverviewStats(data);
                })
                .fail(function() {
                    $('#overview-stats').html('<div class="error">Failed to load statistics</div>');
                });
        }

        function displayOverviewStats(data) {
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-number">${data.tables.races || 0}</div>
                    <div class="stat-label">Total Races</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.tables.horses || 0}</div>
                    <div class="stat-label">Horses</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.tables.jockeys_stats || 0}</div>
                    <div class="stat-label">Jockeys</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.tables.trainers_stats || 0}</div>
                    <div class="stat-label">Trainers</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.statistics.total_courses || 0}</div>
                    <div class="stat-label">Courses</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.latest_data.latest_race_date || 'N/A'}</div>
                    <div class="stat-label">Latest Race</div>
                </div>
            `;
            $('#overview-stats').html(statsHtml);
        }

        // Load races data
        function loadRaces(page = 0, search = '') {
            const params = new URLSearchParams({
                limit: pageSize,
                offset: page * pageSize
            });
            
            if (search) params.append('course', search);
            
            const dateFrom = $('#race-date-from').val();
            const dateTo = $('#race-date-to').val();
            if (dateFrom) params.append('date_from', dateFrom);
            if (dateTo) params.append('date_to', dateTo);

            $('#races-table-container').html('<div class="loading">Loading races...</div>');
            
            $.get(`/api/database/races?${params}`)
                .done(function(data) {
                    displayRacesTable(data.races, page);
                })
                .fail(function() {
                    $('#races-table-container').html('<div class="error">Failed to load races</div>');
                });
        }

        function displayRacesTable(races, page) {
            let tableHtml = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Course</th>
                            <th>Race</th>
                            <th>Type</th>
                            <th>Distance</th>
                            <th>Runners</th>
                            <th>Prize</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            races.forEach(race => {
                tableHtml += `
                    <tr onclick="viewRaceDetails(${race.race_id})" style="cursor: pointer;">
                        <td>${race.date}</td>
                        <td>${race.course || 'N/A'}</td>
                        <td>${race.race_name || `Race ${race.race_number}`}</td>
                        <td>${race.race_type || 'N/A'}</td>
                        <td>${race.distance || 'N/A'}</td>
                        <td>${race.runners || race.runners_racecard || 'N/A'}</td>
                        <td>${race.prize || 'N/A'}</td>
                    </tr>
                `;
            });
            
            tableHtml += '</tbody></table>';
            
            // Add pagination
            tableHtml += createPagination(page, 'races');
            
            $('#races-table-container').html(tableHtml);
        }

        // Load horses data
        function loadHorses(page = 0, search = '') {
            const params = new URLSearchParams({
                limit: pageSize,
                offset: page * pageSize
            });
            
            if (search) params.append('search', search);

            $('#horses-table-container').html('<div class="loading">Loading horses...</div>');
            
            $.get(`/api/database/horses?${params}`)
                .done(function(data) {
                    displayHorsesTable(data.horses, page);
                })
                .fail(function() {
                    $('#horses-table-container').html('<div class="error">Failed to load horses</div>');
                });
        }

        function displayHorsesTable(horses, page) {
            let tableHtml = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Country</th>
                            <th>Total Races</th>
                            <th>Wins</th>
                            <th>Win %</th>
                            <th>Owner</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            horses.forEach(horse => {
                tableHtml += `
                    <tr onclick="viewHorseDetails(${horse.id})" style="cursor: pointer;">
                        <td><strong>${horse.name}</strong></td>
                        <td>${horse.age}</td>
                        <td>${horse.country}</td>
                        <td>${horse.total_races || 0}</td>
                        <td>${horse.wins || 0}</td>
                        <td>${horse.percentage_wins || '0%'}</td>
                        <td>${horse.owner || 'N/A'}</td>
                    </tr>
                `;
            });
            
            tableHtml += '</tbody></table>';
            tableHtml += createPagination(page, 'horses');
            
            $('#horses-table-container').html(tableHtml);
        }

        // Load jockeys data
        function loadJockeys(page = 0) {
            const params = new URLSearchParams({
                limit: pageSize,
                offset: page * pageSize
            });

            $('#jockeys-table-container').html('<div class="loading">Loading jockeys...</div>');
            
            $.get(`/api/database/jockeys?${params}`)
                .done(function(data) {
                    displayJockeysTable(data.jockeys, page);
                })
                .fail(function() {
                    $('#jockeys-table-container').html('<div class="error">Failed to load jockeys</div>');
                });
        }

        function displayJockeysTable(jockeys, page) {
            let tableHtml = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Jockey</th>
                            <th>Total Rides</th>
                            <th>Wins</th>
                            <th>Win %</th>
                            <th>Places</th>
                            <th>Place %</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            jockeys.forEach(jockey => {
                tableHtml += `
                    <tr>
                        <td><strong>${jockey.jockey_name}</strong></td>
                        <td>${jockey.total_rides || 0}</td>
                        <td>${jockey.wins || 0}</td>
                        <td>${jockey.win_percentage ? jockey.win_percentage.toFixed(2) + '%' : '0%'}</td>
                        <td>${jockey.places || 0}</td>
                        <td>${jockey.place_percentage ? jockey.place_percentage.toFixed(2) + '%' : '0%'}</td>
                    </tr>
                `;
            });
            
            tableHtml += '</tbody></table>';
            tableHtml += createPagination(page, 'jockeys');
            
            $('#jockeys-table-container').html(tableHtml);
        }

        // Load trainers data
        function loadTrainers(page = 0) {
            const params = new URLSearchParams({
                limit: pageSize,
                offset: page * pageSize
            });

            $('#trainers-table-container').html('<div class="loading">Loading trainers...</div>');
            
            $.get(`/api/database/trainers?${params}`)
                .done(function(data) {
                    displayTrainersTable(data.trainers, page);
                })
                .fail(function() {
                    $('#trainers-table-container').html('<div class="error">Failed to load trainers</div>');
                });
        }

        function displayTrainersTable(trainers, page) {
            let tableHtml = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Trainer</th>
                            <th>Total Runners</th>
                            <th>Wins</th>
                            <th>Win %</th>
                            <th>Places</th>
                            <th>Place %</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            trainers.forEach(trainer => {
                tableHtml += `
                    <tr>
                        <td><strong>${trainer.trainer_name}</strong></td>
                        <td>${trainer.total_runners || 0}</td>
                        <td>${trainer.wins || 0}</td>
                        <td>${trainer.win_percentage ? trainer.win_percentage.toFixed(2) + '%' : '0%'}</td>
                        <td>${trainer.places || 0}</td>
                        <td>${trainer.place_percentage ? trainer.place_percentage.toFixed(2) + '%' : '0%'}</td>
                    </tr>
                `;
            });
            
            tableHtml += '</tbody></table>';
            tableHtml += createPagination(page, 'trainers');
            
            $('#trainers-table-container').html(tableHtml);
        }

        // Load analytics
        function loadAnalytics() {
            // Load course statistics
            $.get('/api/database/analytics/courses')
                .done(function(data) {
                    createCourseChart(data);
                });
            
            // Load race type statistics
            $.get('/api/database/analytics/race-types')
                .done(function(data) {
                    createRaceTypeChart(data);
                });
        }

        function createCourseChart(data) {
            const ctx = document.getElementById('courseChart').getContext('2d');
            const top10 = data.slice(0, 10);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: top10.map(item => item.course),
                    datasets: [{
                        label: 'Total Races',
                        data: top10.map(item => item.total_races),
                        backgroundColor: 'rgba(102, 126, 234, 0.7)',
                        borderColor: '#667eea',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function createRaceTypeChart(data) {
            const ctx = document.getElementById('raceTypeChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.map(item => item.race_type),
                    datasets: [{
                        data: data.map(item => item.total_races),
                        backgroundColor: [
                            '#667eea',
                            '#764ba2',
                            '#f093fb',
                            '#f5576c',
                            '#4facfe',
                            '#43e97b'
                        ]
                    }]
                },
                options: {
                    responsive: true
                }
            });
        }

        // Utility functions
        function createPagination(currentPage, type) {
            const totalPages = Math.min(10, currentPage + 5); // Limit pagination for demo
            let paginationHtml = '<div class="pagination">';
            
            if (currentPage > 0) {
                paginationHtml += `<button class="page-btn" onclick="loadPage${type.charAt(0).toUpperCase() + type.slice(1)}(${currentPage - 1})">Previous</button>`;
            }
            
            for (let i = Math.max(0, currentPage - 2); i <= Math.min(totalPages - 1, currentPage + 2); i++) {
                const activeClass = i === currentPage ? 'active' : '';
                paginationHtml += `<button class="page-btn ${activeClass}" onclick="loadPage${type.charAt(0).toUpperCase() + type.slice(1)}(${i})">${i + 1}</button>`;
            }
            
            paginationHtml += `<button class="page-btn" onclick="loadPage${type.charAt(0).toUpperCase() + type.slice(1)}(${currentPage + 1})">Next</button>`;
            paginationHtml += '</div>';
            
            return paginationHtml;
        }

        function loadPageRaces(page) {
            currentPage.races = page;
            loadRaces(page);
        }

        function loadPageHorses(page) {
            currentPage.horses = page;
            loadHorses(page);
        }

        function loadPageJockeys(page) {
            currentPage.jockeys = page;
            loadJockeys(page);
        }

        function loadPageTrainers(page) {
            currentPage.trainers = page;
            loadTrainers(page);
        }

        // Search functions
        function searchRaces() {
            const search = $('#race-search').val();
            loadRaces(0, search);
        }

        function searchHorses() {
            const search = $('#horse-search').val();
            loadHorses(0, search);
        }

        // Detail view functions
        function viewRaceDetails(raceId) {
            // This would open a modal or redirect to a detail page
            alert(`Race details for race ID: ${raceId}\n(Detail view to be implemented)`);
        }

        function viewHorseDetails(horseId) {
            // This would open a modal or redirect to a detail page
            alert(`Horse details for horse ID: ${horseId}\n(Detail view to be implemented)`);
        }
    </script>
</body>
</html>
