<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Racing AI Dashboard - V2.03</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #764ba2;
        }

        .nav {
            display: flex;
            gap: 2rem;
        }

        .nav a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav a:hover {
            background: #667eea;
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #764ba2;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 12px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        .search-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .live-updates {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .live-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .race-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .race-item {
            display: flex;
            justify-content: between;
            align-items: center;
            padding: 1rem;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .race-item:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateX(4px);
        }

        .race-info {
            flex: 1;
        }

        .race-venue {
            font-weight: 600;
            color: #764ba2;
            margin-bottom: 0.25rem;
        }

        .race-time {
            font-size: 0.9rem;
            color: #666;
        }

        .race-predictions {
            text-align: right;
            color: #4CAF50;
            font-weight: 500;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            border-left: 4px solid #dc3545;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            border-left: 4px solid #28a745;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .main-container {
                margin: 1rem auto;
                padding: 0 1rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .race-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .race-predictions {
                text-align: left;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 1rem;
            }

            .card {
                padding: 1.5rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">🏇 Racing AI v2.03</div>
            <nav class="nav">
                <a href="/">Dashboard</a>
                <a href="/races">Live Races</a>
                <a href="/predictions">Predictions</a>
                <a href="/analytics">Analytics</a>
            </nav>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">?</div>
                <span id="userName">Guest</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                placeholder="Search horses, jockeys, venues..."
                id="globalSearch"
            >
        </div>

        <div class="dashboard-grid">
            <!-- Live Updates Card -->
            <div class="card live-updates">
                <div class="card-header">
                    <h2 class="card-title" style="color: white;">
                        <span class="live-indicator"></span>
                        Live Updates
                    </h2>
                    <div class="card-icon">📡</div>
                </div>
                <div id="liveUpdates">
                    <p>Connecting to live data feed...</p>
                </div>
            </div>

            <!-- Statistics Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">System Overview</h2>
                    <div class="card-icon">📊</div>
                </div>
                <div class="stats-grid" id="systemStats">
                    <div class="stat-item">
                        <div class="stat-value" id="totalRaces">-</div>
                        <div class="stat-label">Total Races</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalHorses">-</div>
                        <div class="stat-label">Horses Tracked</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalPredictions">-</div>
                        <div class="stat-label">Predictions Made</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="accuracyRate">-</div>
                        <div class="stat-label">Accuracy Rate</div>
                    </div>
                </div>
            </div>

            <!-- Today's Races Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Today's Races</h2>
                    <div class="card-icon">🏁</div>
                </div>
                <div class="race-list" id="todayRaces">
                    <div class="loading"></div>
                </div>
            </div>

            <!-- Top Predictions Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Top Predictions</h2>
                    <div class="card-icon">🎯</div>
                </div>
                <div id="topPredictions">
                    <div class="loading"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // WebSocket connection for real-time updates
        let ws = null;
        let isAuthenticated = false;
        let authToken = localStorage.getItem('authToken');

        // Initialize the dashboard
        document.addEventListener('DOMContentLoaded', function() {
            initializeAuth();
            loadDashboardData();
            setupSearch();
            
            {% if websocket_enabled %}
            connectWebSocket();
            {% endif %}
        });

        function initializeAuth() {
            if (authToken) {
                // Verify token and get user info
                fetch('/api/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('Invalid token');
                })
                .then(data => {
                    isAuthenticated = true;
                    updateUserInfo(data.user);
                })
                .catch(error => {
                    console.error('Auth error:', error);
                    localStorage.removeItem('authToken');
                    authToken = null;
                });
            }
        }

        function updateUserInfo(user) {
            document.getElementById('userName').textContent = user.username;
            document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();
        }

        function loadDashboardData() {
            // Load system statistics
            const headers = {};
            if (authToken) {
                headers['Authorization'] = `Bearer ${authToken}`;
            }

            if (isAuthenticated) {
                fetch('/api/dashboard/stats', { headers })
                    .then(response => response.json())
                    .then(data => updateSystemStats(data))
                    .catch(error => console.error('Error loading stats:', error));
            }

            // Load today's races
            fetch('/api/races?limit=10', { headers })
                .then(response => response.json())
                .then(data => updateTodayRaces(data.races))
                .catch(error => console.error('Error loading races:', error));
        }

        function updateSystemStats(data) {
            const overview = data.overview || {};
            document.getElementById('totalRaces').textContent = overview.total_races || 0;
            document.getElementById('totalHorses').textContent = overview.total_horses || 0;
            document.getElementById('totalPredictions').textContent = overview.total_predictions || 0;
            document.getElementById('accuracyRate').textContent = 
                (overview.accuracy_rate ? (overview.accuracy_rate * 100).toFixed(1) + '%' : '-');
        }

        function updateTodayRaces(races) {
            const container = document.getElementById('todayRaces');
            container.innerHTML = '';

            if (races.length === 0) {
                container.innerHTML = '<p>No races available today.</p>';
                return;
            }

            races.forEach(race => {
                const raceElement = document.createElement('div');
                raceElement.className = 'race-item';
                raceElement.onclick = () => window.location.href = `/race/${race.id}`;
                
                raceElement.innerHTML = `
                    <div class="race-info">
                        <div class="race-venue">${race.venue || 'Unknown Venue'}</div>
                        <div class="race-time">${formatRaceTime(race.race_time)}</div>
                    </div>
                    <div class="race-predictions">
                        ${race.status === 'upcoming' ? 'Predictions Ready' : race.status}
                    </div>
                `;
                
                container.appendChild(raceElement);
            });
        }

        function formatRaceTime(timeString) {
            if (!timeString) return 'Time TBD';
            try {
                const time = new Date(timeString);
                return time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (error) {
                return timeString;
            }
        }

        function setupSearch() {
            const searchInput = document.getElementById('globalSearch');
            let searchTimeout;

            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                
                if (query.length < 2) return;

                searchTimeout = setTimeout(() => {
                    performSearch(query);
                }, 300);
            });
        }

        function performSearch(query) {
            const headers = { 'Content-Type': 'application/json' };
            if (authToken) {
                headers['Authorization'] = `Bearer ${authToken}`;
            }

            fetch('/api/search', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ query: query, limit: 5 })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Search results:', data);
                // Display search results (could implement dropdown)
            })
            .catch(error => console.error('Search error:', error));
        }

        {% if websocket_enabled %}
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function(event) {
                console.log('WebSocket connected');
                updateLiveStatus('Connected to live data feed');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };
            
            ws.onclose = function(event) {
                console.log('WebSocket disconnected');
                updateLiveStatus('Disconnected - Attempting to reconnect...');
                
                // Attempt to reconnect after 5 seconds
                setTimeout(connectWebSocket, 5000);
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateLiveStatus('Connection error');
            };
        }

        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'connection_established':
                    updateLiveStatus('✅ Live data feed active');
                    break;
                case 'heartbeat':
                    // Keep connection alive
                    break;
                case 'system_update':
                    handleSystemUpdate(data.updates);
                    break;
                case 'race_update':
                    handleRaceUpdate(data);
                    break;
                default:
                    console.log('Unknown message type:', data.type);
            }
        }

        function updateLiveStatus(message) {
            const liveUpdates = document.getElementById('liveUpdates');
            liveUpdates.innerHTML = `<p>${message}</p>`;
        }

        function handleSystemUpdate(updates) {
            if (updates) {
                updateLiveStatus(`📊 System update: ${JSON.stringify(updates)}`);
            }
        }

        function handleRaceUpdate(data) {
            updateLiveStatus(`🏁 Race ${data.race_id} update received`);
        }
        {% endif %}

        // Utility function to show messages
        function showMessage(message, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
            messageDiv.textContent = message;
            
            document.querySelector('.main-container').insertBefore(messageDiv, document.querySelector('.dashboard-grid'));
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // Handle window visibility change to manage WebSocket connection
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // Page is hidden
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.close();
                }
            } else {
                // Page is visible again
                {% if websocket_enabled %}
                if (!ws || ws.readyState === WebSocket.CLOSED) {
                    connectWebSocket();
                }
                {% endif %}
            }
        });
    </script>
</body>
</html>
