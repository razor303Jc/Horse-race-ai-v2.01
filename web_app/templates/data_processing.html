<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Processing - Horse Racing AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .processing-btn { margin: 5px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-horse-head"></i> Horse Racing AI
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link active" href="/data-processing">Data Processing</a>
                <a class="nav-link" href="/predictions">Predictions</a>
                <a class="nav-link" href="/monitoring">Monitoring</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">
                    <i class="fas fa-cogs"></i> Data Processing Control
                </h1>
            </div>
        </div>

        <!-- Processing Controls -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-play-circle"></i> Manual Processing Controls
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h6>Today's Data</h6>
                                <button class="btn btn-primary processing-btn" onclick="processData('cards', 'today')">
                                    <i class="fas fa-file-alt"></i> Process Cards Today
                                </button>
                                <button class="btn btn-success processing-btn" onclick="processData('results', 'today')">
                                    <i class="fas fa-chart-bar"></i> Process Results Today
                                </button>
                                <button class="btn btn-info processing-btn" onclick="processData('both', 'today')">
                                    <i class="fas fa-sync"></i> Process Both Today
                                </button>
                            </div>
                            <div class="col-md-6">
                                <h6>Range Processing</h6>
                                <button class="btn btn-warning processing-btn" onclick="processData('both', 'week')">
                                    <i class="fas fa-calendar-week"></i> Last 7 Days
                                </button>
                                <button class="btn btn-secondary processing-btn" onclick="showCustomRange()">
                                    <i class="fas fa-calendar-alt"></i> Custom Range
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-tools"></i> System Actions
                    </div>
                    <div class="card-body">
                        <button class="btn btn-outline-primary btn-sm d-block mb-2" onclick="testDatabase()">
                            <i class="fas fa-database"></i> Test Database
                        </button>
                        <button class="btn btn-outline-success btn-sm d-block mb-2" onclick="startAPIs()">
                            <i class="fas fa-rocket"></i> Start APIs
                        </button>
                        <button class="btn btn-outline-info btn-sm d-block mb-2" onclick="testAPIs()">
                            <i class="fas fa-heartbeat"></i> Test APIs
                        </button>
                        <button class="btn btn-outline-warning btn-sm d-block" onclick="triggerFullPipeline()">
                            <i class="fas fa-play"></i> Full Pipeline
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Date Range Modal -->
        <div class="modal fade" id="customRangeModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Custom Date Range Processing</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="customRangeForm">
                            <div class="mb-3">
                                <label for="startDate" class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="startDate" required>
                            </div>
                            <div class="mb-3">
                                <label for="endDate" class="form-label">End Date</label>
                                <input type="date" class="form-control" id="endDate" required>
                            </div>
                            <div class="mb-3">
                                <label for="dataType" class="form-label">Data Type</label>
                                <select class="form-select" id="dataType">
                                    <option value="both">Both Cards & Results</option>
                                    <option value="cards">Cards Only</option>
                                    <option value="results">Results Only</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="processCustomRange()">
                            <i class="fas fa-play"></i> Start Processing
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Processing Log -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-list"></i> Processing Log
                        <button class="btn btn-sm btn-outline-light float-end" onclick="clearLog()">
                            <i class="fas fa-trash"></i> Clear
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="processingLog" style="height: 300px; overflow-y: auto; background: #f8f9fa; padding: 15px; border-radius: 5px;">
                            <p class="text-muted mb-0">Ready for processing... Click any button above to start.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function processData(type, period) {
            const today = new Date().toISOString().split('T')[0];
            let startDate = today;
            let endDate = today;

            if (period === 'week') {
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                startDate = weekAgo.toISOString().split('T')[0];
            }

            addLogEntry(`Starting ${type} processing for ${period === 'today' ? 'today' : 'last 7 days'}...`, 'info');

            fetch('/api/trigger-processing', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    type: type,
                    start_date: startDate,
                    end_date: endDate
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    addLogEntry(`✅ ${type} processing triggered successfully`, 'success');
                } else {
                    addLogEntry(`❌ Failed to trigger processing: ${data.message}`, 'error');
                }
            })
            .catch(error => {
                addLogEntry(`❌ Error: ${error.message}`, 'error');
            });
        }

        function showCustomRange() {
            const modal = new bootstrap.Modal(document.getElementById('customRangeModal'));
            
            // Set default dates
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('endDate').value = today;
            
            const weekAgo = new Date();
            weekAgo.setDate(weekAgo.getDate() - 7);
            document.getElementById('startDate').value = weekAgo.toISOString().split('T')[0];
            
            modal.show();
        }

        function processCustomRange() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const dataType = document.getElementById('dataType').value;

            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }

            if (new Date(startDate) > new Date(endDate)) {
                alert('Start date cannot be after end date');
                return;
            }

            const modal = bootstrap.Modal.getInstance(document.getElementById('customRangeModal'));
            modal.hide();

            addLogEntry(`Starting custom range processing: ${startDate} to ${endDate} (${dataType})...`, 'info');

            fetch('/api/trigger-processing', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    type: dataType,
                    start_date: startDate,
                    end_date: endDate
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    addLogEntry(`✅ Custom range processing triggered successfully`, 'success');
                } else {
                    addLogEntry(`❌ Failed to trigger processing: ${data.message}`, 'error');
                }
            })
            .catch(error => {
                addLogEntry(`❌ Error: ${error.message}`, 'error');
            });
        }

        function testDatabase() {
            addLogEntry('Testing database connection...', 'info');
            
            fetch('/api/test-database', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    addLogEntry('✅ Database connection successful', 'success');
                } else {
                    addLogEntry(`❌ Database connection failed: ${data.message}`, 'error');
                }
            })
            .catch(error => {
                addLogEntry(`❌ Database test error: ${error.message}`, 'error');
            });
        }

        function startAPIs() {
            addLogEntry('Starting APIs...', 'info');
            
            fetch('/api/start-apis', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    addLogEntry('✅ APIs start triggered', 'success');
                } else {
                    addLogEntry(`❌ Failed to start APIs: ${data.message}`, 'error');
                }
            })
            .catch(error => {
                addLogEntry(`❌ API start error: ${error.message}`, 'error');
            });
        }

        function testAPIs() {
            addLogEntry('Testing API health...', 'info');
            
            fetch('/api/system-status')
            .then(response => response.json())
            .then(data => {
                const status = data.api_status;
                addLogEntry(`API Status - Prediction: ${status.prediction_api ? '✅' : '❌'}, ML: ${status.ml_api ? '✅' : '❌'}, Node-RED: ${status.node_red ? '✅' : '❌'}`, 'info');
            })
            .catch(error => {
                addLogEntry(`❌ API test error: ${error.message}`, 'error');
            });
        }

        function triggerFullPipeline() {
            if (confirm('This will run the complete data pipeline. Continue?')) {
                addLogEntry('Triggering full pipeline...', 'info');
                
                fetch('/api/trigger-pipeline', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addLogEntry('✅ Full pipeline triggered successfully', 'success');
                    } else {
                        addLogEntry(`❌ Failed to trigger pipeline: ${data.message}`, 'error');
                    }
                })
                .catch(error => {
                    addLogEntry(`❌ Pipeline error: ${error.message}`, 'error');
                });
            }
        }

        function addLogEntry(message, type) {
            const log = document.getElementById('processingLog');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            
            let className = '';
            switch(type) {
                case 'success': className = 'text-success'; break;
                case 'error': className = 'text-danger'; break;
                case 'info': className = 'text-info'; break;
                default: className = 'text-dark';
            }
            
            entry.innerHTML = `<small class="text-muted">[${timestamp}]</small> <span class="${className}">${message}</span>`;
            entry.style.marginBottom = '5px';
            
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {
            document.getElementById('processingLog').innerHTML = '<p class="text-muted mb-0">Log cleared. Ready for processing...</p>';
        }
    </script>
</body>
</html>
