version: "3.8"

services:
  # PostgreSQL Database - Primary database for main operations
  postgres:
    image: postgres:15-alpine
    container_name: horse_racing_postgres
    environment:
      POSTGRES_DB: horse_racing_db
      POSTGRES_USER: horse_racing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"  # Use different port to avoid conflicts
    networks:
      - horse_racing_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horse_racing -d horse_racing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: horse_racing_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_123}
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"  # Use different port to avoid conflicts
    networks:
      - horse_racing_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # React + FastAPI Web Application
  horse-racing-ai:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.react
    container_name: horse_racing_react_app
    environment:
      # Database configuration
      DATABASE_URL: postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0

      # API settings
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app

      # Scraping configuration
      SCRAPER_HEADLESS: "true"
      SCRAPER_TIMEOUT: 30000

      # Notification settings
      NTFY_TOPIC: ${NTFY_TOPIC:-horse-racing-alerts}
      NTFY_URL: http://ntfy:8081

      # ML Model settings
      MODEL_PATH: /app/models
      FEATURE_CACHE_PATH: /app/cache/features
      
      # BETDAQ API settings (if available)
      BETDAQ_API_KEY: ${BETDAQ_API_KEY:-}
      BETDAQ_USERNAME: ${BETDAQ_USERNAME:-}
      BETDAQ_PASSWORD: ${BETDAQ_PASSWORD:-}

      # Live feed API keys (if available)
      RACING_POST_API_KEY: ${RACING_POST_API_KEY:-}
      TIMEFORM_API_KEY: ${TIMEFORM_API_KEY:-}
      
      # Racing Analyzer settings
      OLLAMA_HOST: ${OLLAMA_HOST:-host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-jimscard/whiterabbit-neo:13b-q5_K_M}
      RACING_ANALYZER_TIMEOUT: ${RACING_ANALYZER_TIMEOUT:-3600}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./trained_models:/app/trained_models
      - ./reports:/app/reports
    ports:
      - "8000:8000"  # React + FastAPI Application
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    networks:
      - horse_racing_network
      - traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system_status"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Traefik configuration for React + FastAPI Application
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-dev"
      
      # HTTP Web Application Routes
      - "traefik.http.routers.horse-racing-web-http.rule=Host(`horse-racing.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.horse-racing-web-http.entrypoints=http"
      - "traefik.http.routers.horse-racing-web-http.service=horse-racing-web"
      
      # HTTPS Web Application Routes
      - "traefik.http.routers.horse-racing-web.rule=Host(`horse-racing.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.horse-racing-web.entrypoints=websecure"
      - "traefik.http.routers.horse-racing-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.horse-racing-web.service=horse-racing-web"
      
      # Service configuration
      - "traefik.http.services.horse-racing-web.loadbalancer.server.port=8000"
      
      # Health check middleware (removed for testing)
      # - "traefik.http.routers.horse-racing-web.middlewares=auth@file"

  # OLD Playwright Scraper Service - DISABLED (replaced by dedicated auto-downloader)
  # scraper:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.scraper
  #   container_name: horse_racing_scraper
  #   environment:
  #     DATABASE_URL: postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
  #     REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
  #     DEBUG: ${DEBUG:-false}
  #     LOG_LEVEL: ${LOG_LEVEL:-INFO}
  #     PYTHONPATH: /app/src
  #     SCRAPER_HEADLESS: "true"
  #     NTFY_TOPIC: ${NTFY_TOPIC:-horse-racing-alerts}
  #     NTFY_URL: http://ntfy:8081
  #   volumes:
  #     - ./data:/app/data
  #     - ./cache:/app/cache
  #     - ./logs:/app/logs
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     ntfy:
  #       condition: service_healthy
  #   networks:
  #     - horse_racing_network
  #     - traefik
  #   restart: unless-stopped
  #   # Run scraper as a scheduled service
  #   command: ["python", "-m", "src.horse_racing_ai.automation.scheduler"]
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.docker.network=traefik"
  #     
  #     # Scraper monitoring interface (if exposed)
  #     - "traefik.http.routers.horse-racing-scraper.rule=Host(`scraper.horse-racing.${DOMAIN:-localhost}`)"
  #     - "traefik.http.routers.horse-racing-scraper.entrypoints=websecure"
  #     - "traefik.http.routers.horse-racing-scraper.tls.certresolver=letsencrypt"
  #     - "traefik.http.routers.horse-racing-scraper.service=horse-racing-scraper"
  #     - "traefik.http.services.horse-racing-scraper.loadbalancer.server.port=8001"
  #     - "traefik.http.routers.horse-racing-scraper.middlewares=auth@file"

  # NTFY Notification Server
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: horse_racing_ntfy
    command:
      - serve
    environment:
      # Base configuration
      - NTFY_BASE_URL=http://localhost:8081
      - NTFY_LISTEN_HTTP=:8081
      - NTFY_BEHIND_PROXY=false
      
      # Security settings
      - NTFY_AUTH_DEFAULT_ACCESS=read-write
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
      
      # Cache and persistence
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_CACHE_DURATION=12h
      - NTFY_KEEPALIVE_INTERVAL=45s
      - NTFY_MANAGER_INTERVAL=1m
      
      # Message limits
      - NTFY_MESSAGE_SIZE_LIMIT=4096
      - NTFY_GLOBAL_TOPIC_LIMIT=15000
      - NTFY_VISITOR_SUBSCRIPTION_LIMIT=30
      
      # Logging
      - NTFY_LOG_LEVEL=INFO
      - NTFY_LOG_FORMAT=text
    
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_config:/etc/ntfy
      
    ports:
      - "8081:8081"  # NTFY web interface and API
      
    networks:
      - horse_racing_network
      - traefik
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      
      # NTFY web interface
      - "traefik.http.routers.horse-racing-ntfy.rule=Host(`ntfy.horse-racing.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.horse-racing-ntfy.entrypoints=websecure"
      - "traefik.http.routers.horse-racing-ntfy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.horse-racing-ntfy.service=horse-racing-ntfy"
      - "traefik.http.services.horse-racing-ntfy.loadbalancer.server.port=8081"
      - "traefik.http.routers.horse-racing-ntfy.middlewares=auth@file"

  # Database Administration (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: horse_racing_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@horseracingai.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password_123}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "8083:80"  # Use different port to avoid conflicts
    depends_on:
      - postgres
    networks:
      - horse_racing_network
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      
      # pgAdmin web interface
      - "traefik.http.routers.horse-racing-pgadmin.rule=Host(`pgadmin.horse-racing.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.horse-racing-pgadmin.entrypoints=websecure"
      - "traefik.http.routers.horse-racing-pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.horse-racing-pgadmin.service=horse-racing-pgadmin"
      - "traefik.http.services.horse-racing-pgadmin.loadbalancer.server.port=80"
      - "traefik.http.routers.horse-racing-pgadmin.middlewares=auth@file"

  # MkDocs Documentation Server with Reporting Capabilities
  mkdocs:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.mkdocs
    container_name: horse_racing_docs
    ports:
      - "8001:8000"
    volumes:
      - ./docs:/docs
      - ./mkdocs.yml:/docs/mkdocs.yml
      - ./documentation:/docs/docs/documentation
      - ./README.md:/docs/docs/index.md
      - ./docker/requirements/requirements.txt:/docs/docs/requirements.txt
      - ./pyproject.toml:/docs/docs/pyproject.toml
      - ./reports:/docs/docs/reports
      - ./tools:/docs/tools
      - ./experiments:/docs/experiments
      - ./trained_models:/docs/trained_models
    networks:
      - horse_racing_network
      - traefik
    restart: unless-stopped
    command: serve --dev-addr=0.0.0.0:8000
    environment:
      - LIVE_RELOAD_SUPPORT=true
      - FAST_MODE=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=horse_racing_db
      - POSTGRES_USER=horse_racing
      - POSTGRES_PASSWORD=secure_password_123
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-dev"
      
      # HTTP Documentation Routes
      - "traefik.http.routers.horse-racing-docs-http.rule=Host(`docs.horse-racing.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.horse-racing-docs-http.entrypoints=http"
      - "traefik.http.routers.horse-racing-docs-http.service=horse-racing-docs"
      
      # HTTPS Documentation Routes
      - "traefik.http.routers.horse-racing-docs.rule=Host(`docs.horse-racing.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.horse-racing-docs.entrypoints=websecure"
      - "traefik.http.routers.horse-racing-docs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.horse-racing-docs.service=horse-racing-docs"
      
      # Service configuration
      - "traefik.http.services.horse-racing-docs.loadbalancer.server.port=8000"

  # Reports and Analytics Service
  reports:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.reports
    container_name: horse_racing_reports
    environment:
      DATABASE_URL: postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      PYTHONPATH: /app
      REPORTS_OUTPUT: /app/reports
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./tools:/app/tools
      - ./experiments:/app/experiments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - horse_racing_network
    restart: "no"  # Run on demand
    profiles:
      - reports
      - analytics

  # Racing News Analyzer with Ollama
  news-analyzer:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.news-analyzer
    container_name: racing_news_analyzer
    restart: unless-stopped
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./news_analysis.db:/app/news_analysis.db
      - news_analyzer_data:/app/data
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"  # Ollama API
      - "8080:8080"    # Future web interface
    networks:
      - horse_racing_network
    healthcheck:
      test: ["CMD", "python3", "news_dashboard.py", "--status"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m
    profiles:
      - news-analyzer

  # Data Processing Service
  data-processor:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.data-optimized
      args:
        USER_NAME: ${USER_NAME:-jc}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: horse_racing_data_processor
    environment:
      DATABASE_URL: postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - horse_racing_network
    restart: unless-stopped
    profiles:
      - data-processing

  # Auto-Downloader Service (Integrated from separate docker-compose)
  auto-downloader:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile
      args:
        USER_NAME: ${USER_NAME:-jc}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: horserace-auto-downloader
    environment:
      - DOCKER_CONTAINER=true
      - HEADLESS=true
      - PLAYWRIGHT_BROWSERS_PATH=/app/.playwright
      - TZ=Europe/London
      - LOG_LEVEL=INFO
      # WooCommerce credentials (from .env file)
      - HORSERACE_DB_USERNAME=${HORSERACE_DB_USERNAME}
      - HORSERACE_DB_PASSWORD=${HORSERACE_DB_PASSWORD}
      - HORSERACE_DB_RESULTS_URL=${HORSERACE_DB_RESULTS_URL}
      - HORSERACE_DB_CARDS_URL=${HORSERACE_DB_CARDS_URL}
      # Enhanced error handling
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Database integration
      - DATABASE_URL=postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
    volumes:
      # Persistent data storage
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
      # Browser and system optimization
      - /tmp:/tmp
      - /dev/shm:/dev/shm
      # Timezone data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - horse_racing_network
    restart: unless-stopped
    
    # Enhanced startup command with better error handling
    command: ["python", "run_docker_auto_downloader.py", "--mode", "scheduled", "--log-level", "INFO"]
    
    # Improved health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.append('/app'); from src.automation.docker_config import validate_docker_setup; exit(0 if validate_docker_setup() else 1)"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m
    
    # Resource limits optimized for browser operation
    deploy:
      resources:
        limits:
          memory: 3G  # Increased for browser operations
          cpus: '1.5'  # Increased for better performance
        reservations:
          memory: 1G   # Increased base reservation
          cpus: '0.5'

    # Enhanced security and operation
    security_opt:
      - seccomp:unconfined  # Required for Chrome/Chromium in containers
    
    # Browser optimization
    shm_size: 2gb  # Important for browser stability
    
    # Ensure proper shutdown handling
    stop_grace_period: 30s
    stop_signal: SIGTERM
    
    profiles:
      - data-processing

  # Test service for manual auto-downloader runs  
  auto-downloader-test:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile
      args:
        USER_NAME: ${USER_NAME:-jc}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: horserace-auto-downloader-test
    environment:
      - DOCKER_CONTAINER=true
      - HEADLESS=true
      - PLAYWRIGHT_BROWSERS_PATH=/app/.playwright
      - TZ=UTC
      - LOG_LEVEL=DEBUG
      - HORSERACE_DB_USERNAME=${HORSERACE_DB_USERNAME}
      - HORSERACE_DB_PASSWORD=${HORSERACE_DB_PASSWORD}
      - HORSERACE_DB_RESULTS_URL=${HORSERACE_DB_RESULTS_URL}
      - HORSERACE_DB_CARDS_URL=${HORSERACE_DB_CARDS_URL}
      - DATABASE_URL=postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
      - /tmp:/tmp
      - /dev/shm:/dev/shm
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - horse_racing_network
    # Run once and exit for testing
    command: ["python", "run_docker_auto_downloader.py", "--mode", "once", "--log-level", "DEBUG"]
    profiles:
      - test
    shm_size: 2gb
    security_opt:
      - seccomp:unconfined
    stop_grace_period: 30s
    stop_signal: SIGTERM

  # Pipeline Management Service
  pipeline-manager:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.pipeline-management
    container_name: horse_racing_pipeline_manager
    environment:
      DATABASE_URL: postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - horse_racing_network
    restart: unless-stopped
    profiles:
      - pipeline-management

  # Early Morning ML Training Service
  ml-models:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.ml-models
      args:
        USER_NAME: ${USER_NAME:-jc}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: horse_racing_early_morning_ml
    environment:
      # Database and cache
      DATABASE_URL: postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      PYTHONPATH: /app
      
      # Early Morning ML Training Configuration
      ML_TRAINING_START_TIME: ${ML_TRAINING_START_TIME:-00:30}
      ML_TRAINING_END_TIME: ${ML_TRAINING_END_TIME:-04:00}
      ML_TRAINING_WINDOW_MINUTES: ${ML_TRAINING_WINDOW_MINUTES:-210}
      ML_MAX_CYCLES: ${ML_MAX_CYCLES:-8}
      ML_CYCLE_DURATION_MINUTES: ${ML_CYCLE_DURATION_MINUTES:-25}
      ML_BUFFER_MINUTES: ${ML_BUFFER_MINUTES:-5}
      ML_MAX_RETRIES: ${ML_MAX_RETRIES:-3}
      ML_TIMEOUT_SECONDS: ${ML_TIMEOUT_SECONDS:-1800}
      
      # Logging and monitoring
      ML_LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
      ML_PERFORMANCE_TRACKING: ${ML_PERFORMANCE_TRACKING:-true}
      ML_DETAILED_METRICS: ${ML_DETAILED_METRICS:-true}
      ML_MONITORING_ENABLED: ${ML_MONITORING_ENABLED:-true}
      
      # Docker paths
      DATA_PATH: /app/data
      MODELS_PATH: /app/models
      LOGS_PATH: /app/logs
      CACHE_PATH: /app/cache
      REPORTS_PATH: /app/reports
      
      # Pipeline integration
      PIPELINE_AUTO_START: ${PIPELINE_AUTO_START:-true}
      PIPELINE_CHECK_DOWNLOAD_STATUS: ${PIPELINE_CHECK_DOWNLOAD_STATUS:-true}
      PIPELINE_INTEGRATION_ENABLED: ${PIPELINE_INTEGRATION_ENABLED:-true}
      
      # Legacy compatibility
      ML_TRAINING_MODE: early_morning
      MODEL_SAVE_PATH: /app/trained_models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./tools:/app/tools
      - ./docker:/app/docker
      - ./logs:/app/logs
      - ./config:/app/config
      - ./data:/app/data
      - ./trained_models:/app/trained_models
      - ./results:/app/results
      - ./reports:/app/reports
      - ./models:/app/models
      - ./cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auto-downloader:
        condition: service_healthy
    networks:
      - horse_racing_network
    restart: unless-stopped
    profiles:
      - ml-training
    # Early morning ML training with pipeline integration
    command: ["python", "/app/docker/ml_training/pipeline_integration.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.append('/app/docker/ml_training'); from pipeline_integration import EarlyMorningPipelineIntegration; integration = EarlyMorningPipelineIntegration(); print('ML Training System Ready')"]
      interval: 60s
      timeout: 30s
      start_period: 30s
      retries: 3

  # Real-time Processing Monitor
  realtime-processor:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.ml-models  # Same base as ML models
      args:
        USER_NAME: ${USER_NAME:-jc}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: horse_racing_realtime_processor
    environment:
      DATABASE_URL: postgresql://horse_racing:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/horse_racing_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      PYTHONPATH: /app
      MONITORING_INTERVAL: ${MONITORING_INTERVAL:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./tools:/app/tools
      - ./logs:/app/logs
      - ./config:/app/config
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-models:
        condition: service_started
    networks:
      - horse_racing_network
    restart: unless-stopped
    profiles:
      - realtime-processing
    # Monitor for new data and trigger ML training
    command: ["python", "/app/tools/realtime_processor.py"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  ntfy_cache:
    driver: local
  ntfy_config:
    driver: local
  news_analyzer_data:
    driver: local

networks:
  horse_racing_network:
    driver: bridge
    name: horse_racing_network
  traefik:
    external: true
    name: traefik-dev
