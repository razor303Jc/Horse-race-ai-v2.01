# Configuration file for pytest
# Rebuilded Test Framework - Horse Racing AI v2.04

[tool:pytest]
# Test discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests between components
    system: End-to-end system tests
    performance: Performance and load tests
    slow: Slow running tests
    docker: Tests requiring Docker
    database: Tests requiring database connection
    ml: Machine learning related tests
    api: API endpoint tests
    bulk_uploader: Bulk uploader system tests
    pipeline: Pipeline system tests
    web_app: Web application Playwright tests
    critical: Critical path tests that must pass
    smoke: Quick smoke tests for basic functionality
    comprehensive: Comprehensive end-to-end testing

# Test execution options
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --maxfail=3
    --cov=src 
    --cov=tools 
    --cov=api 
    --cov=docker
    --cov-report=term-missing
    --cov-report=html:tests/reports/coverage
    --cov-branch
    --cov-fail-under=80# Output and logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeouts
timeout = 300
timeout_method = thread

# Parallel execution
addopts += -n auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pandas.*

# Minimum version requirements
minversion = 6.0

# Test collection
norecursedirs = 
    venv
    .venv
    node_modules
    .git# Docker integration
docker_compose_file = docker-compose.test.yml
docker_compose_project_name = horse_racing_ai_test
