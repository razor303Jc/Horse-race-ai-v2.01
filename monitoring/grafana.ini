# Grafana Configuration
server:
  root_url: http://localhost:3000
  serve_from_sub_path: false

# Data sources configuration
datasources:
  - name: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

# Dashboard provisioning
dashboards:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

# Security
security:
  admin_user: admin
  admin_password: horseracing2024

# Enable anonymous access for development
auth.anonymous:
  enabled: true
  org_name: Main Org.
  org_role: Viewer

# Plugin management
plugins:
  enable_alpha: false
  app_tls_skip_verify_insecure: false

# Logging
log:
  mode: console
  level: info

# Metrics
metrics:
  enabled: true
  basic_auth_username: grafana
  basic_auth_password: metrics2024
