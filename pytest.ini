# pytest configuration for Horse Racing AI V2.03 Comprehensive Testing
[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --disable-warnings
    --color=yes

markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    security: Security tests
    slow: Slow running tests
    external: Tests requiring external dependencies
    docker: Docker-related tests
    system: System-level tests
    smoke: Quick smoke tests
    stress: Stress and load tests
    optimization: Build and performance optimization tests

# Ignore specific warnings during testing
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::PendingDeprecationWarning

# Async testing configuration
asyncio_mode = auto
