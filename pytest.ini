# pytest configuration for Phase 3 testing framework
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
# Ignore specific warnings during testing
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::PydanticDeprecatedSince20",
]
# Async testing configuration
asyncio_mode = "auto"

# Coverage configuration (when using pytest-cov)
addopts = "--cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=70"
